trigger:
  branches:
    include:
      - refs/tags/*

pool:
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- powershell: |
    Write-Host "SourceBranchName: $(Build.SourceBranchName)"
    $tag = "$(Build.SourceBranchName)"
    # Extract version: remove 'refs/tags/v'
    $version = $tag.Replace("refs/tags/v","")
    Write-Host "Extracted version: $version"
    Write-Host "##vso[task.setvariable variable=Version]$version"
  displayName: "Extract version from tag"

- script: dotnet restore
  displayName: "Restore"

- script: dotnet build --configuration Release
  displayName: "Build"

- script: dotnet pack --configuration Release /p:PackageVersion=$(Version)
  displayName: "Pack"

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '**/*.nupkg'
    publishVstsFeed: 'SampleSharedServicesApi'
  displayName: "Publish to Azure Artifacts"
