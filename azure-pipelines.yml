trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: dotnet restore
  displayName: "Restore"

- script: dotnet build --configuration Release
  displayName: "Build"

- script: dotnet pack --configuration Release --output $(Build.ArtifactStagingDirectory)
  displayName: "Pack"

- task: CopyFiles@2
  displayName: "Copy NuGet package to staging"
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/bin/Release'
    Contents: '*.nupkg'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- task: NuGetCommand@2
  displayName: "Publish to Azure Artifacts"
  inputs:
    command: push
    nuGetFeedType: external
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
    publishFeedCredentials: 'SampleSharedServiceApi_NuGet_ServiceConnection'
    publishFeedUrl: 'https://pkgs.dev.azure.com/jobsmacoro/SampleSharedServicesApi_AzureDevOps/_packaging/SampleSharedServicesAPIFeed/nuget/v3/index.json'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)



